[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-canvas"
version = "0.1.0"
description = "A production-minded PyTorch implementation of neural style transfer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Agney Praseed" }]
keywords = ["computer-vision", "deep-learning", "neural-style-transfer", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
]

[project.optional-dependencies]
demo = ["gradio>=5,<7"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
nst = "neural_style_transfer.cli:main"

[project.urls]
Homepage = "https://agneypraseed.github.io/"
Repository = "https://github.com/Agneypraseed/neural-canvas"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
