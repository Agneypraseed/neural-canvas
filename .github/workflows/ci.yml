name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev,demo]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Smoke-test package import
        run: python -c "import neural_style_transfer"

      - name: Smoke-test CLI
        run: nst --help

      - name: Smoke-test demo import
        run: python -c "import app; assert app.demo is not None"

      - name: Build wheel
        run: python -m build --wheel

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag neural-canvas:ci .

      - name: Start container
        run: docker run --detach --name neural-canvas-ci --publish 7860:7860 neural-canvas:ci

      - name: Smoke-test Gradio HTTP endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:7860/gradio_api/info >/dev/null; then
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Status}}' neural-canvas-ci)" != "running" ]; then
              docker logs neural-canvas-ci
              exit 1
            fi

            sleep 2
          done

          docker logs neural-canvas-ci
          exit 1

      - name: Remove container
        if: always()
        run: docker rm --force neural-canvas-ci || true
